<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0F1E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Treino em Casa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Direção: caderno de treino, denso e direto. Cinza-azulado frio, vermelho-tomate como único acento, números grandes em fonte condensada. Navegação por abas embaixo, uma coluna só. */
:root{
  --bg:#0A0F1E; --surface:#141B30; --surface2:#1E2742; --ink:#F4F6FB; --muted:#98A2BE; --line:#27304D;
  --accent:#2F6BFF; --accent-ink:#FFFFFF; --ok:#34D399; --ok-bg:rgba(52,211,153,.14); --warn:#FBBF24; --warn-bg:rgba(251,191,36,.12);
  --font-d:'Barlow Condensed','Arial Narrow',system-ui,sans-serif; --font-b:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --water:#38BDF8; --hero-row:rgba(255,255,255,.18);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--font-d);font-weight:700;margin:0;line-height:1.05;text-wrap:balance;letter-spacing:.2px}
h1{font-size:28px} h2{font-size:30px} h3{font-size:21px}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto}
.top{padding:calc(12px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.kicker{font-size:13px;color:var(--muted);text-transform:none}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 24px;-webkit-overflow-scrolling:touch}
#view{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.card.flat{background:transparent;border-style:dashed}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.btn{min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{min-height:38px;padding:0 12px;font-size:14px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5}
.hero{border-color:var(--accent);border-width:2px}
.hero h2{margin:4px 0 6px}
.num{font-family:var(--font-d);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ci{display:grid;gap:6px;margin-top:10px}
.stats .stat .num.sm{font-size:22px}
.thg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th{position:relative;border:0;padding:0;border-radius:12px;overflow:hidden;aspect-ratio:3/4;background:var(--surface2)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th span{position:absolute;left:6px;bottom:6px;font-size:11px;background:rgba(0,0,0,.6);padding:2px 7px;border-radius:8px;color:#fff}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmpi{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:var(--surface2);display:block}
.cmpi.empty{display:flex;align-items:center;justify-content:center;text-align:center;padding:8px}
.pm{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px}
.pm img{max-width:100%;max-height:72vh;border-radius:12px}
.livemini{display:none;position:sticky;top:0;z-index:6;margin-bottom:10px;padding:9px 12px;border-radius:14px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);font-size:13px;justify-content:space-between;gap:8px}
.livemini.show{display:flex}
.gauge{position:relative;height:12px;border-radius:99px;margin:12px 0 6px;background:linear-gradient(90deg,#4F8DFF 0 14%,#2FBF71 14% 40%,#F5B83D 40% 60%,#F2674A 60% 100%)}
.gauge i{position:absolute;top:-4px;width:6px;height:20px;border-radius:3px;background:#fff;box-shadow:0 0 0 2px var(--bg);transform:translateX(-3px);transition:left .25s}
.gl{display:grid;grid-template-columns:14fr 26fr 20fr 40fr;font-size:10px;color:var(--muted);text-align:center}
.imcn{font-family:var(--font-d);font-size:54px;line-height:1}
.avatar.big{width:72px;height:72px;font-size:36px;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar{overflow:hidden;width:54px;height:54px;border-radius:50%;background:linear-gradient(150deg,var(--accent),#1B3FBF);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:28px;flex:none}
.ci .seg{grid-template-columns:repeat(3,1fr)}
.ci .seg button{font-size:13px;padding:8px 4px;min-height:38px}
.stats .stat .num{font-size:28px}
.stat{background:var(--surface2);border-radius:10px;padding:10px}
.stat .num{font-size:34px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0}
.dot{aspect-ratio:1;border-radius:10px;border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--muted);background:var(--surface)}
.dot.done{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.today{border-color:var(--accent);border-width:2.5px;color:var(--ink)}
.dot.done.today{color:#fff}
.dot b{font-size:15px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.tag.acc{background:var(--accent);color:var(--accent-ink)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.note{background:var(--warn-bg);color:var(--ink);border-radius:12px;padding:12px;border-left:4px solid var(--warn)}
details>summary{cursor:pointer;list-style:none;font-weight:600;min-height:32px;display:flex;align-items:center;justify-content:space-between;gap:8px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";font-family:var(--font-d);font-size:24px;color:var(--muted)}
details[open]>summary::after{content:"–"}
ul.how{margin:8px 0 0;padding-left:20px} ul.how li{margin:4px 0}
.sessrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.letter{font-family:var(--font-d);font-weight:700;font-size:30px;width:46px;height:46px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex:none}
.sessrow.next{border-color:var(--accent);border-width:2px}
.sessrow.next .letter{background:var(--accent);color:var(--accent-ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;min-height:40px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.ex{display:flex;flex-direction:column;gap:6px}
.ex.done{opacity:.6}
.ex.done .exn{text-decoration:line-through}
.exhead{display:flex;gap:12px;align-items:flex-start}
.chk{width:28px;height:28px;flex:none;accent-color:var(--accent);margin-top:2px}
.exn{font-family:var(--font-d);font-weight:700;font-size:21px;line-height:1.1}
.pill{font-variant-numeric:tabular-nums;font-weight:600}
.timer{position:sticky;bottom:0;z-index:2;display:flex;gap:6px;align-items:center;justify-content:space-between;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 10px;margin-top:4px}
.timer .btn{min-height:36px;padding:0 10px;font-size:14px;background:transparent;color:var(--bg);border-color:rgba(127,127,127,.5)}
.timer b{font-family:var(--font-d);font-size:26px;min-width:56px;font-variant-numeric:tabular-nums}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs button{border:0;background:transparent;min-height:52px;padding:0;border-radius:10px;font-size:10.5px;letter-spacing:-.1px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent)}
label.item{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
label.item:first-of-type{border-top:0}
label.item .t{flex:1}
label.item.got .t b{text-decoration:line-through;color:var(--muted)}
input[type=number],input[type=date],input[type=text],textarea{width:100%;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:8px 12px}
textarea{min-height:70px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent);min-height:36px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{display:flex;flex-direction:column;gap:4px}
.field span{font-size:13px;color:var(--muted);font-weight:600}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:6px;background:var(--surface2);display:block}
.heat i.on{background:var(--ok)}
.heat i.min{background:var(--ok);opacity:.45}
.heat i.t{outline:2px solid var(--accent)}
.meal{border-top:1px solid var(--line);padding-top:12px}
.meal:first-child{border-top:0;padding-top:0}
.opt{background:var(--surface2);border-radius:10px;padding:10px;margin-top:8px}
.opt b{display:block}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:10px;font-family:var(--font-b)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:10;max-width:90%;text-align:center}
.toast[hidden]{display:none}
textarea.out{font-size:13px;min-height:120px}
.pbar{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok)}
.dot.sh{border-style:dashed;border-color:var(--ok);color:var(--ok)}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);display:flex;flex-direction:column;gap:2px}
.badge.lock{opacity:.55;background:transparent;border-style:dashed}
.badge b{font-family:var(--font-d);font-size:18px;line-height:1.1}
.badge .ic{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;margin-bottom:4px}
.badge.lock .ic{background:var(--surface2);color:var(--muted)}
.celebrate{border:2px solid var(--ok);background:var(--ok-bg)}
.rwd{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.gnum{font-family:var(--font-d);font-weight:700;font-size:104px;line-height:1;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0}
.greps{font-family:var(--font-d);font-weight:700;font-size:56px;line-height:1.05;text-align:center;margin:12px 0}
.ghero.restk{border-color:var(--ok);background:var(--ok-bg)}
.ghero.workk{border-color:var(--accent);border-width:2px}
.btn.big{min-height:64px;font-size:19px;width:100%}
select{width:100%;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:8px 12px;color:var(--ink)}
.thumbs{display:flex;gap:4px;overflow-x:auto;padding:4px 0}
.thumbs img{height:64px;border-radius:6px;flex:none}
.rvout{white-space:pre-wrap}
label.btn{display:flex;align-items:center;justify-content:center;text-align:center}
.ic{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.xi{width:44px;height:44px;border-radius:12px;background:var(--surface2);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.tilehero{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);border-radius:20px;padding:16px}
.tilehero .eyebrow,.tilehero .muted{color:var(--accent-ink);opacity:.85}
.tilehero .tag{background:var(--hero-row);color:var(--accent-ink)}
.tilehero h2{font-size:36px}
.xlist{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.xrow{display:flex;gap:10px;align-items:center;background:var(--hero-row);border-radius:12px;padding:8px 10px}
.xrow .xi{width:36px;height:36px;background:transparent;color:var(--accent-ink)}
.xrow b{flex:1;font-weight:600;line-height:1.2}
.xrow span{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.btn.onhero{background:var(--accent-ink);color:var(--accent);border-color:transparent}
.btn.onhero.line{background:transparent;color:var(--accent-ink);border:1.5px solid var(--accent-ink)}
.daystat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ds{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.ds .v{font-family:var(--font-d);font-weight:700;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.ds.ok{border-color:var(--ok)}
.ds .pbar{margin-top:6px;height:6px}
.cups{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.cup{aspect-ratio:3/4;border:2px solid var(--line);border-radius:4px 4px 12px 12px;background:transparent;padding:0}
.cup.on{border-color:var(--water);background:var(--water)}
.mrow{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.mrow.got .small{opacity:.55}
.mchk{width:34px;height:34px;flex:none;border-radius:50%;border:2px solid var(--line);background:transparent;font-weight:700;font-size:18px;color:var(--ok);line-height:1;padding:0}
.mchk.on{background:var(--ok-bg);border-color:var(--ok)}
.sessrow .strip{display:flex;gap:6px;color:var(--muted);margin-top:4px}
.gic{display:flex;justify-content:center;color:var(--accent);margin-top:6px}

/* ===== visual de app ===== */
h1,h2{text-transform:uppercase;letter-spacing:.5px}
h1{font-size:32px}
.card{border-radius:18px}
.top{align-items:center}
.chips{display:flex;gap:6px;align-items:center}
.chip{display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.chip svg{width:16px;height:16px;flex:none}
.btn{border-radius:14px}
.btn.primary{min-height:54px;font-size:16px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;box-shadow:0 6px 18px rgba(47,107,255,.35)}
.btn.white{background:#fff;color:#0A0F1E;border-color:#fff;font-weight:700;letter-spacing:.8px;text-transform:uppercase;min-height:54px;font-size:16px}
.btn.glass{background:rgba(255,255,255,.16);color:#fff;border-color:transparent}
.tabs{background:var(--surface);border-top:1px solid var(--line)}
.tabs button.on{color:#fff}
.tabs button.on svg{stroke:var(--accent)}
.tabs button.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tabs button{position:relative}
svg.fig{display:block;width:100%;height:100%}
.ftile{position:relative;border-radius:16px;overflow:hidden;background:linear-gradient(150deg,var(--tc,#2F6BFF),color-mix(in srgb,var(--tc,#2F6BFF) 48%,#000))}
.ftile.big{height:150px}
.ftile.xl{height:200px}
.ftile.rest{height:110px;margin-top:8px}
.xgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.xt{border:0;padding:0;text-align:left;background:var(--surface);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;color:inherit}
.xt .ftile{border-radius:16px 16px 0 0;aspect-ratio:160/116}
.xt .xl{padding:8px 10px 10px}
.xt .xl b{display:block;font-family:var(--font-d);text-transform:uppercase;font-size:16.5px;line-height:1.1;letter-spacing:.3px}
.xt .xl span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.hero2{border-radius:22px;padding:12px;background:linear-gradient(150deg,var(--tc),color-mix(in srgb,var(--tc) 45%,#000));color:#fff}
.hero2 .ftile{background:rgba(0,0,0,.2)}
.hero2 h2{font-size:34px;margin-top:10px}
.hero2 .sub{opacity:.85}
.hero2 .eyebrow{color:rgba(255,255,255,.85)}
.hero2 .tag{background:rgba(0,0,0,.25);color:#fff}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rg{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);border-radius:18px;padding:12px 6px 10px}
.rg b{position:absolute;top:12px;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:19px}
.rg span{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.7px}
.wkrow{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:16px;background:var(--surface)}
.wkrow.on{background:var(--accent);color:#fff}
.wkrow .wd{width:42px;text-align:center;line-height:1.05;font-size:12px;font-weight:700;text-transform:uppercase;color:var(--muted)}
.wkrow .wd b{display:block;font-family:var(--font-d);font-size:24px;color:var(--ink)}
.wkrow.on .wd,.wkrow.on .wn span{color:rgba(255,255,255,.85)}
.wkrow.on .wd b{color:#fff}
.wkrow.miss{opacity:.5}
.wkrow .wn{flex:1;min-width:0}
.wkrow .wn b{display:block;font-family:var(--font-d);font-size:19px;text-transform:uppercase;line-height:1.1;letter-spacing:.3px}
.wkrow .wn span{font-size:13px;color:var(--muted)}
.wc{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;font-size:16px;font-weight:700}
.wc.ok{background:var(--accent);border-color:var(--accent);color:#fff}
.wkrow.on .wc{border-color:#fff}
.wkrow.on .wc.ok{background:#fff;color:var(--accent)}
.scard{border-radius:22px;padding:12px;background:linear-gradient(150deg,var(--tc),color-mix(in srgb,var(--tc) 45%,#000));color:#fff;text-align:left;width:100%;border:0;display:block}
.scard .sf{display:flex;gap:2px;background:rgba(0,0,0,.2);border-radius:14px;padding:4px 2px}
.scard .sf svg.fig{flex:1;min-width:0;height:auto;width:33%}
.scard h3{font-size:27px;text-transform:uppercase;margin-top:10px;letter-spacing:.4px}
.scard .sub{opacity:.85;font-size:14px}
.scard.next{outline:3px solid #fff;outline-offset:2px}
.chal .wr{display:grid;grid-template-columns:40px repeat(7,1fr);gap:5px;align-items:center;margin-top:6px}
.chal .wr small{font-size:11px;color:var(--muted);font-weight:700;text-align:center}
.chal .cell{aspect-ratio:1;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700}
.chal .cell.ok{background:var(--accent)}
.chal .cell.today{outline:2px solid #fff;outline-offset:1px}
.chal .cell.fut{opacity:.45}
.cup.on{box-shadow:0 0 10px rgba(56,189,248,.5)}
.cup{border-color:var(--surface2)}
.waterc{background:linear-gradient(150deg,#0B3A66,#0A1F3A);border-color:transparent}
.mrow{border-top-color:var(--surface2)}
.ghero{border-radius:22px}

/* ===== casca de app ===== */
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
input,textarea,select{user-select:text;-webkit-user-select:text}
#app{height:100dvh;max-width:560px}
main{min-height:0;padding-top:6px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
button:active:not([disabled]){transform:scale(.97)}
button{transition:transform .08s}
.bar{flex:none;min-height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 10px 0 10px;display:flex;align-items:center;gap:6px;background:var(--bg)}
.bar.tabm{padding-left:16px;justify-content:space-between}
.bar.tabm h1{font-size:30px}
.bar .bk{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.bar .bc{flex:1;text-align:center;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ba{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:16px;letter-spacing:.5px;text-transform:uppercase;min-width:64px;min-height:44px}
.bar:empty{display:none}
#cta{flex:none;padding:8px 16px 10px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
#cta:empty{display:none}
.cta{width:100%;min-height:58px;border-radius:999px;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:17px;letter-spacing:.8px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 22px rgba(47,107,255,.45)}
.cta svg{width:22px;height:22px;fill:#fff}
#app.full .bar,#app.full .tabs,#app.full #cta{display:none}
#app.full main{padding:0;overflow:hidden}
#app.full #view{height:100%;gap:0}
.hs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hs .xt{flex:0 0 150px;scroll-snap-align:start}
.tl{position:relative;padding-left:28px;display:flex;flex-direction:column;gap:8px}
.tl::before{content:"";position:absolute;left:9px;top:14px;bottom:14px;width:2px;background:var(--line)}
.tl .wkrow{position:relative}
.tl .wkrow::before{content:"";position:absolute;left:-28px;top:50%;margin-top:-10px;width:20px;height:20px;border-radius:50%;border:3px solid var(--line);background:var(--bg)}
.tl .wkrow.done::before{background:var(--accent);border-color:var(--accent)}
.tl .wkrow.on::before{border-color:var(--accent);box-shadow:0 0 0 5px rgba(47,107,255,.28)}
.erow{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:16px;padding:8px 10px 8px 8px}
.erow .ebtn{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:left;padding:0;color:inherit}
.erow .eth{width:84px;height:62px;flex:none;border-radius:12px}
.erow .et{display:flex;flex-direction:column;min-width:0}
.erow .et b{font-size:16px;line-height:1.2;font-weight:600}
.erow .et small{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.erow .ec{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.erow .ec.ok{background:var(--ok);border-color:var(--ok);color:#06281C}
.erow.done .et b{text-decoration:line-through;color:var(--muted)}
.gh{margin:10px 0 0}
.mstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mstat div{background:rgba(0,0,0,.22);border-radius:14px;padding:8px 6px;text-align:center}
.mstat b{display:block;font-family:var(--font-d);font-size:26px;line-height:1.1}
.mstat span{font-size:12px;opacity:.85}
.cir3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:6px 0}
.cw{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;color:inherit;padding:0}
.cw[disabled]{opacity:.5}
.cc{width:92px;height:92px;border-radius:50%;border:5px solid var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.cc.blue{border-color:var(--water)} .cc.warm{border-color:#FB7185} .cc.ok{border-color:var(--ok)}
.cc small{font-size:15px;font-weight:600}
.exhd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.exhd h2{font-size:26px}
.center{text-align:center}
/* treino guiado em tela cheia */
.gs{position:relative;display:flex;flex-direction:column;height:100%;padding:calc(10px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom))}
.gtop{display:flex;align-items:center;gap:8px}
.gx,.gi{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.gseg{flex:1;display:flex;gap:3px}
.gseg i{flex:1;height:4px;border-radius:2px;background:var(--surface2)}
.gseg i.on{background:var(--accent)} .gseg i.cur{background:#fff}
.glab{text-align:center;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;font-size:13px;color:var(--muted);margin-top:14px}
.gs.rest .glab{color:var(--ok)}
.gname{text-align:center;font-family:var(--font-d);font-size:30px;font-weight:700;text-transform:uppercase;line-height:1.05;margin-top:4px}
.gsub{text-align:center;color:var(--muted);font-size:14px;margin-top:2px}
.gmid{display:flex;justify-content:center;margin:10px 0}
.gring{width:min(52vw,210px);aspect-ratio:1;position:relative}
.gring svg{width:100%;height:100%;display:block}
.gring .gn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gring .gnum{font-size:clamp(46px,15vw,66px);margin:0;line-height:1;color:var(--accent)}
.gs.rest .gring .gnum{color:var(--ok)}
.gring .greps{font-size:clamp(40px,13vw,58px);margin:0;line-height:1}
.gring .gunit{font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.gfig{flex:1;min-height:120px;margin:4px 0 12px}
.gfig .ftile{height:100%;width:100%}
.gbot{display:flex;align-items:center;gap:12px}
.gc{width:54px;height:54px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.gc svg,.gx svg,.gi svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gpill{flex:1;min-height:58px;border-radius:999px;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:18px;letter-spacing:.8px;text-transform:uppercase;box-shadow:0 8px 22px rgba(47,107,255,.4);display:flex;align-items:center;justify-content:center;gap:8px}
.gpill svg{width:20px;height:20px;fill:#fff}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:72%;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -12px 32px rgba(0,0,0,.55);z-index:5}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheet .card{background:transparent;border:0;padding:0}
.gs.end{justify-content:space-between}
.gs.end .gcenter{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
@media (prefers-reduced-motion:no-preference){
  .slide{animation:slidein .22s ease-out}
  @keyframes slidein{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
}

.altf{display:grid;gap:8px;margin-top:8px}
.toggle{flex:none;width:52px;height:30px;border-radius:15px;background:#2A3350;border:0;position:relative;transition:background .2s}
.toggle i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on{background:#2F6BFF}.toggle.on i{transform:translateX(22px)}
</style>
</head>
<body>
<div id="app">
  <header class="bar" id="bar"></header>
  <main id="main"><div id="view"></div></main>
  <div id="cta"></div>
  <nav class="tabs" id="tabs" aria-label="Seções">
    <button data-act="tab" data-id="hoje"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>Hoje</button>
    <button data-act="tab" data-id="treino"><svg viewBox="0 0 24 24"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></svg>Treino</button>
    <button data-act="tab" data-id="comida"><svg viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 2 2v8M11 3v8M7 7h4M17 21V3c-2 1-3 4-3 8h3"/></svg>Comida</button>
    <button data-act="tab" data-id="compras"><svg viewBox="0 0 24 24"><path d="M5 7h15l-1.5 9H7zM5 7L4 3H2M9 20h.01M17 20h.01"/></svg>Compras</button>
    <button data-act="tab" data-id="evolucao"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Evolução</button>
    <button data-act="tab" data-id="premios"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></svg>Prêmios</button>
    <button data-act="tab" data-id="perfil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>Perfil</button>
  </nav>
  <div class="toast" id="toast" hidden></div>
</div>

<script>
/* ========== Conteúdo ========== */
const EX = {
  marcha:{n:'Marcha no lugar',how:['Suba os joelhos até a altura do quadril, braços soltos balançando.','Pise leve, sem bater o pé no chão (vizinhos).'],tip:'Sem saltos. Serve para aquecer e, no circuito, para manter o coração em ritmo.'},
  gato_camelo:{n:'Gato e camelo',how:['Em quatro apoios, mãos sob os ombros e joelhos sob o quadril.','Arredonde a coluna olhando para o umbigo, depois abra o peito olhando à frente.','Movimento lento, respirando junto.'],tip:'Vá só até onde não doer. Lubrifica a coluna e prepara a lombar.'},
  rot_toracica:{n:'Abertura de tórax',how:['Em quatro apoios, uma mão atrás da cabeça.','Gire o cotovelo para baixo do corpo e depois para o teto, seguindo com o olhar.','Faça todas as repetições de um lado e troque.'],tip:'Mobilidade da parte de cima das costas, onde ficam as escápulas.'},
  crianca:{n:'Posição da criança',how:['Joelhos no tapete, sente nos calcanhares e leve os braços à frente.','Descanse a testa e respire fundo.'],tip:'Se o joelho incomodar, ponha uma toalha dobrada atrás do joelho.'},
  flex_quadril:{n:'Alongamento do flexor do quadril',how:['Um joelho no tapete e o outro pé à frente (postura de pedido).','Contraia o glúteo da perna de trás e leve o quadril um pouco à frente.','Troque de lado.'],tip:'Quadril travado puxa a lombar. Sem arquear as costas.'},
  along_peito:{n:'Alongamento do peitoral no batente',how:['Antebraço apoiado no batente da porta, cotovelo na altura do ombro.','Gire o corpo devagar para o lado oposto até sentir o peito abrir.'],tip:'Não força o ombro: pare no primeiro puxão.'},
  respiracao:{n:'Respiração 4 e 6',how:['Deitado ou sentado, inspire pelo nariz contando 4.','Solte pela boca contando 6. Repita por 1 minuto.'],tip:'Baixa o ritmo antes do banho.'},
  agach_cadeira:{n:'Agachamento até a cadeira',how:['Cadeira atrás de você, encostada na parede. Pés na largura dos ombros.','Sente para trás e para baixo até tocar de leve a cadeira, joelhos na direção dos pés, peito aberto.','Suba empurrando o chão. Desça em 3 segundos.'],tip:'Joelho: não deixe cair para dentro e pare onde não doer. Sem salto. Progressão: abraçar a mochila no peito.'},
  flexao:{n:'Flexão de braço',how:['Mãos um pouco mais abertas que os ombros, corpo em linha dos calcanhares à cabeça.','Desça o peito até quase tocar o chão em 2 a 3 segundos, cotovelos a 45° do tronco.','Empurre o chão e suba sem deixar a lombar afundar.'],tip:'Mais fácil: mãos na cama ou joelhos no tapete. Mais difícil: pés na cama, pausa de 2 s embaixo.'},
  supino_elastico:{n:'Supino com elástico nas costas',how:['Passe o elástico atrás das costas, na altura das axilas, e segure as pontas.','Mãos na altura do peito, cotovelos a 45°.','Estenda os braços à frente sem subir os ombros e volte em 3 s.'],tip:'Um pé à frente para firmar. Elástico mais curto ou mais forte aumenta a carga.'},
  elev_lateral:{n:'Elevação lateral',how:['Em pé, halteres ao lado do corpo, cotovelos levemente dobrados.','Suba os braços até a altura dos ombros sem balançar o tronco.','Desça em 3 s.'],tip:'Com 1 a 2 kg o segredo é a lentidão: vá até queimar. Sem peso, use garrafas de água.'},
  triceps_elastico:{n:'Tríceps com elástico acima da cabeça',how:['Pise numa ponta do elástico, um pé à frente, e leve a outra ponta atrás da cabeça com as duas mãos.','Cotovelos apontando para cima, perto das orelhas.','Estenda os braços para cima sem arquear a lombar e volte devagar.'],tip:'Costelas para dentro, abdômen firme. Se a lombar arquear, use elástico mais fraco.'},
  dead_bug:{n:'Dead bug',how:['Deitado de barriga para cima, braços para o teto, joelhos a 90° sobre o quadril.','Pressione a lombar de leve contra o chão.','Estenda o braço direito para trás e a perna esquerda à frente, sem a lombar descolar. Volte e troque.'],tip:'Lento e curto. Se a lombar levantar, diminua o movimento. É o abdômen seguro para a sua coluna.'},
  prancha:{n:'Prancha com antebraços',how:['Antebraços e pontas dos pés no tapete, corpo em linha reta.','Contraia abdômen e glúteos, olhe para o chão.','Respire normal.'],tip:'Pare quando a lombar afundar ou doer. Alternativa: joelhos no tapete.'},
  afundo_reverso:{n:'Afundo reverso alternado',how:['Em pé, uma mão na cadeira ou na parede.','Dê um passo atrás e dobre os dois joelhos até a coxa da frente ficar quase paralela ao chão.','Empurre com a perna da frente para voltar. Alterne.'],tip:'O passo atrás é mais gentil com o joelho. Apoie o pé com suavidade.'},
  ponte:{n:'Ponte de glúteo',how:['Deitado, joelhos dobrados, pés na largura do quadril.','Suba o quadril até formar uma linha do ombro ao joelho, apertando o glúteo.','Segure 1 a 2 s e desça devagar.'],tip:'A força vem do glúteo, não da lombar. Progressão: mochila sobre o quadril.'},
  pant_pe:{n:'Panturrilha em pé',how:['Em pé, mão na parede, pés paralelos.','Suba o máximo que conseguir nas pontas dos pés e segure 2 s.','Desça em 3 s até o calcanhar quase tocar o chão.'],tip:'Mais amplitude: pontas dos pés sobre um livro grosso. Mais difícil: mochila nas costas ou uma perna só.'},
  remada_elastico:{n:'Remada sentada com elástico',how:['Sentado no tapete, elástico em volta dos pés, joelhos levemente dobrados.','Coluna alta, ombros longe das orelhas. Puxe as pontas até as costelas juntando as escápulas.','Segure 1 s e volte em 3 s.'],tip:'Comece o movimento pelas escápulas. Sem jogar o tronco para trás. Elástico fraco: segure mais curto.'},
  remada_unilateral:{n:'Remada com apoio (mochila ou halter)',how:['Mão esquerda na cadeira ou na cama, joelhos levemente dobrados, coluna reta, olhar no chão.','Mochila com 4 a 6 kg (ou halter) na mão direita, braço solto.','Puxe o cotovelo ao quadril, junte a escápula, segure 1 s e desça em 3 s.'],tip:'Sem girar o tronco. O apoio da mão alivia a lombar. Se a lombar doer, troque pela remada com elástico.'},
  ytw:{n:'Y, T e W de bruços',how:['Deitado de barriga para baixo, testa numa toalha dobrada.','Levante os braços em Y (acima da cabeça), depois T (abertos) e W (cotovelos dobrados), 1 s em cada.','Polegares para cima. Suba só até onde as escápulas puxam, sem arquear a lombar.'],tip:'Sem peso. Pequeno e preciso: trabalha a região entre as escápulas.'},
  rosca:{n:'Rosca bíceps',how:['Em pé, cotovelos colados ao tronco, halteres ou elástico preso sob os pés.','Dobre os cotovelos sem balançar o corpo e aperte no topo.','Desça em 3 s.'],tip:'Peso pequeno pede repetição lenta: 1 s no topo, 3 s descendo.'},
  pull_apart:{n:'Abertura com elástico',how:['Em pé, braços à frente na altura do peito, elástico esticado entre as mãos.','Abra os braços para os lados levando as escápulas para trás.','Volte devagar.'],tip:'Ombros longe das orelhas. Bom para postura e para a dor entre as escápulas.'},
  prancha_lat:{n:'Prancha lateral (joelhos)',how:['Deitado de lado, cotovelo sob o ombro, joelhos dobrados.','Suba o quadril até alinhar ombro, quadril e joelho.','Segure respirando e troque de lado.'],tip:'Progressão: pernas esticadas.'},
  desenv_ombro:{n:'Desenvolvimento de ombros com elástico',how:['Pise no elástico, pontas nas mãos na altura dos ombros.','Empurre para cima até quase estender os braços, sem arquear a lombar.','Desça controlando.'],tip:'Abdômen firme, costelas para baixo.'},
  rosca_martelo:{n:'Rosca martelo',how:['Em pé, palmas viradas uma para a outra, cotovelos colados ao tronco.','Suba os halteres até o ombro sem balançar.','Desça em 3 s.'],tip:'Pega neutra: pega o braço todo e o antebraço.'},
  triceps_frances:{n:'Tríceps francês sentado',how:['Sentado na cadeira, coluna reta, halter ou mochila nas duas mãos atrás da cabeça.','Cotovelos apontando para cima. Estenda os braços sem mexer os cotovelos.','Desça devagar.'],tip:'Peso baixo e sem arquear a lombar.'},
  flexao_diamante:{n:'Flexão fechada',how:['Mãos sob o peito, mais juntas que os ombros.','Cotovelos junto às costelas ao descer.','Suba controlando.'],tip:'Joelhos no tapete se precisar. Pare 1 a 2 repetições antes de falhar.'},
  curl_up:{n:'Abdominal curto (curl-up)',how:['Deitado, uma perna dobrada e a outra esticada, mãos sob a curva da lombar.','Levante só a cabeça e os ombros alguns centímetros, como se enrijecesse o pescoço e o abdômen.','Segure 5 s respirando e volte. Troque a perna dobrada na série seguinte.'],tip:'Substitui o abdominal tradicional, que pressiona a coluna.'},
  agach_goblet:{n:'Agachamento sumô com mochila',how:['Mochila de 5 a 8 kg abraçada no peito. Pés mais abertos que os ombros, pontas para fora.','Sente entre as pernas com o tronco ereto, joelhos na direção dos pés.','Suba empurrando o chão.'],tip:'Vá até onde o joelho estiver confortável. Comece sem mochila.'},
  agach_split:{n:'Agachamento em passada fixa',how:['Mão na cadeira ou parede, um pé à frente e o outro atrás, a distância de um passo.','Desça reto dobrando os dois joelhos, sem inclinar o tronco, e suba.','Termine um lado antes de trocar.'],tip:'O joelho da frente acompanha o pé e o calcanhar fica no chão.'},
  ponte_uni:{n:'Ponte de glúteo com uma perna',how:['Como a ponte normal, mas com uma perna esticada no ar.','Suba o quadril sem girar o corpo e sem arquear a lombar.','Desça devagar e troque.'],tip:'Se a parte de trás da coxa der câimbra, aproxime o pé do quadril.'},
  pant_uni:{n:'Panturrilha em uma perna',how:['Em pé numa perna só, mão na parede.','Suba nas pontas do pé, segure 2 s e desça em 3 s.','Troque de perna.'],tip:'Descer devagar é o que mais cresce a panturrilha.'},
  stiff:{n:'Dobrar o quadril com mochila (bom-dia)',how:['Em pé, pés na largura do quadril, joelhos levemente dobrados, mochila no peito.','Empurre o quadril para trás como quem fecha uma gaveta com o bumbum, coluna reta, até sentir a parte de trás das coxas alongar.','Volte contraindo os glúteos.'],tip:'Opcional e só se a lombar estiver tranquila. Comece 2 semanas sem peso. O movimento é do quadril, não da lombar.'},
  monster:{n:'Passos laterais com elástico',how:['Elástico em volta dos joelhos (ou tornozelos), joelhos levemente dobrados.','Dê passos laterais mantendo o elástico esticado.','Volte pelo mesmo caminho.'],tip:'Fortalece o glúteo lateral, que ajuda joelho e lombar. Passos silenciosos.'},
  bird_dog:{n:'Bird dog',how:['Em quatro apoios, coluna neutra.','Estenda um braço e a perna oposta até a linha do corpo, sem girar o quadril.','Segure 5 s e alterne.'],tip:'Imagine um copo de água nas suas costas. Amplitude pequena e controlada vale mais.'},
  ginga:{n:'Ginga de capoeira no lugar',how:['Ginga básica, leve, no seu tempo.','Joelhos flexionados, olhar à frente.','Pé leve, sem bater no chão.'],tip:'Você já conhece. Constância, não velocidade.'},
  soco:{n:'Socos alternados',how:['Postura de guarda, joelhos soltos.','Alterne socos à frente, girando levemente o tronco.','Mantenha o ritmo.'],tip:'Silencioso e sem impacto.'},

let remote=null,pushT=null;
function pushRemote(){
  if(!remote)return;
  clearTimeout(pushT);
  pushT=setTimeout(()=>{try{Promise.resolve(remote.set({json:JSON.stringify(S)})).catch(()=>{})}catch(e){}},700);
}
function save(){S.u=Date.now();saveLocal();pushRemote()}
async function initRemote(){
  try{
    if(!window.claude||!window.claude.use)return;
    const db=await window.claude.use('db');const user=await window.claude.use('user');
    if(!db||!user)return;
    const id=await user.id();
    const doc=db.collection('data/users/'+id).doc('state');
    const snap=await doc.get();
    const ex=typeof snap.exists==='function'?snap.exists():snap.exists;
    const data=ex?(typeof snap.data==='function'?snap.data():snap.data):null;
    remote=doc;
    if(data&&data.json){
      const r=JSON.parse(data.json);
      if((r.u||0)>(S.u||0)){S=Object.assign(fresh(),r);saveLocal();render()}
      else if((S.u||0)>(r.u||0)){pushRemote()}
    }else if(S.u){pushRemote()}
  }catch(e){remote=null}
}

function lastSessions(){return S.workouts.filter(w=>ORDER.includes(w.session)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)}
function sessionFor(ds){const wd=(parse(ds).getDay()+6)%7;let s=SCHED[wd];if(s==='FOCO'){const wk=Math.floor(parse(monKey(ds)).getTime()/604800000);s=WKFOCUS[((wk%3)+3)%3]}return s}
function nextSession(){return sessionFor(todayStr())}
const monKey=s=>{const x=parse(s);x.setDate(x.getDate()-((x.getDay()+6)%7));return fmt(x)};
function stats(){
  const set=new Set(S.workouts.map(w=>w.date));
  const sh=S.shields||[];
  const sset=new Set([...set,...sh]);
  let cur=0;const d=new Date();if(!sset.has(fmt(d)))d.setDate(d.getDate()-1);
  while(sset.has(fmt(d))){cur++;d.setDate(d.getDate()-1)}
  const days=[...sset].sort();let best=0,run=0,prev=null;
  for(const s of days){if(prev&&Math.round((parse(s)-parse(prev))/864e5)===1)run++;else run=1;best=Math.max(best,run);prev=s}
  const mon=new Date();mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  const week=[];let wk=0;
  for(let i=0;i<7;i++){const x=new Date(mon);x.setDate(mon.getDate()+i);const k=fmt(x);const done=set.has(k);if(done)wk++;week.push({k,done,sh:!done&&sh.includes(k),today:k===todayStr(),lbl:['S','T','Q','Q','S','S','D'][i],day:x.getDate()})}
  return {cur,best,week,wk,total:S.workouts.length}
}

function calcBody(v){
  const m=v.h/100,imc=v.kg/(m*m);
  const cat=imc<18.5?['Abaixo do peso','#4F8DFF']:imc<25?['Peso normal','#2FBF71']:imc<30?['Sobrepeso','#F5B83D']:['Obesidade','#F2674A'];
  const bmr=10*v.kg+6.25*v.h-5*v.age+(v.sex==='F'?-161:5);
  return {imc,cat,lo:18.5*m*m,hi:24.9*m*m,bmr:Math.round(bmr),kcal:Math.round((bmr*1.4+70)/50)*50,pLo:Math.round(1.8*v.kg/5)*5,pHi:Math.round(2*v.kg/5)*5,
    water:Math.max(2000,Math.min(3500,Math.round(35*v.kg/250)*250)),whtr:v.waist!=null?v.waist/v.h:null,
    toT:v.t!=null?Math.round((v.t-v.kg)*10)/10:null,imcT:v.t!=null?v.t/(m*m):null}
}

function liveInner(v){
  const f=(n,d)=>(Math.round(n*Math.pow(10,d))/Math.pow(10,d)).toFixed(d).replace('.',',');

  const b=calcBody(v),pos=Math.max(0,Math.min(100,(b.imc-15)/25*100));
  const p=prof(),pending=(v.age!==p.age||v.h!==p.height||v.sex!==p.sex||v.kg!==curKg()||v.t!==p.target||v.waist!==lastWaist());
  const dist=b.toT==null?'—':(b.toT===0?'na meta':(b.toT>0?'+':'')+f(b.toT,1)+' kg');
  const wr=b.whtr==null?['—','sem cintura']:[f(b.whtr,2),b.whtr<0.5?'abaixo de 0,50, bom':'meta: abaixo de 0,50'];
  return `<div class="row between" style="align-items:flex-end"><div><div class="tiny muted">IMC</div><div class="imcn" style="color:${b.cat[1]}">${f(b.imc,1)}</div></div><span class="tag" style="color:${b.cat[1]};border-color:${b.cat[1]}">${b.cat[0]}</span></div>
    <div class="gauge"><i style="left:${pos}%"></i></div>
    <div class="gl"><span>Abaixo</span><span>Normal</span><span>Sobrepeso</span><span>Obesidade</span></div>
    <div class="stats" style="margin-top:12px;grid-template-columns:repeat(3,1fr)">
      <div class="stat"><div class="num sm">${f(b.lo,0)}–${f(b.hi,0)}</div><div class="tiny muted">kg, faixa normal para ${v.h} cm</div></div>
      <div class="stat"><div class="num sm">≈${kfmt(b.kcal)}</div><div class="tiny muted">kcal por dia</div></div>
      <div class="stat"><div class="num sm">${b.pLo}–${b.pHi}</div><div class="tiny muted">g de proteína</div></div>
      <div class="stat"><div class="num sm">${f(b.water/1000,2).replace(/0$/,'')}</div><div class="tiny muted">L de água sugeridos</div></div>
      <div class="stat"><div class="num sm">${wr[0]}</div><div class="tiny muted">cintura ÷ altura, ${wr[1]}</div></div>
      <div class="stat"><div class="num sm">${dist}</div><div class="tiny muted">até o peso desejado${b.imcT!=null?' (IMC '+f(b.imcT,1)+')':''}</div></div>
    </div>
    ${pending?'<p class="tiny" style="margin-top:8px;color:var(--accent)">Prévia com os valores que você digitou. Salve para aplicar no app.</p>':''}
    <p class="tiny muted" style="margin-top:8px">O IMC não separa gordura de músculo. Como você quer perder barriga e ganhar massa, acompanhe também a cintura e as medidas.</p>`;
}

function setPhotoFile(f){
  if(!f)return;
  const rd=new FileReader();
  rd.onerror=()=>toast('Não consegui ler a foto.');
  rd.onload=()=>{const img=new Image();
    img.onerror=()=>toast('Não consegui abrir essa imagem.');
    img.onload=()=>{const n=Math.min(img.width,img.height),sx=(img.width-n)/2,sy=(img.height-n)/2;
      const c=document.createElement('canvas');c.width=c.height=256;c.getContext('2d').drawImage(img,sx,sy,n,n,0,0,256,256);
      S.profile=Object.assign({},S.profile||{},{photo:c.toDataURL('image/jpeg',0.82)});save();render();toast('Foto salva.')};
    img.src=rd.result};

    const bonus=Math.min(n,5)*10;info[d]={base:base[d],bonus,streak:n};total+=base[d]+bonus});
  const wk={};dates.forEach(d=>{const k=monKey(d);wk[k]=(wk[k]||0)+1});
  let weeksOK=0,perfect=0,weekBonus=0;
  Object.values(wk).forEach(n=>{if(n>=5){weeksOK++;weekBonus+=150}if(n>=7){perfect++;weekBonus+=150}});
  const waists=S.weights.filter(w=>w.waist!=null).sort((a,b)=>a.date<b.date?-1:1);
  const meas=waists.length;
  let days=0;Object.keys(S.daily||{}).forEach(d=>{const r=S.daily[d];if(base[d]&&(r.w||0)>=WATER_GOAL&&Object.keys(r.m||{}).filter(k=>r.m[k]).length>=4)days++});

}

function weekData(mk){
  const days=[];for(let i=0;i<7;i++){const x=parse(mk);x.setDate(x.getDate()+i);days.push(fmt(x))}
  const ws=S.workouts.filter(w=>days.includes(w.date));
  const dset=new Set(ws.map(w=>w.date));
  const sh=(S.shields||[]).filter(d=>days.includes(d)&&!dset.has(d)).length;
  const c=calc();let pts=0;days.forEach(d=>{if(c.info[d])pts+=c.info[d].base+c.info[d].bonus});
  let water=0,meals=0,logged=0;
  days.forEach(d=>{const r=(S.daily||{})[d];if(r){if((r.w||0)>=WATER_GOAL)water++;const m=Object.keys(r.m||{}).filter(k=>r.m[k]).length;if(m>0){meals+=m;logged++}}});
  const pains=ws.filter(w=>w.pain!=null).map(w=>w.pain);
  const pain=pains.length?Math.max(...pains):null;
  const sw=S.weights.slice().sort((a,b)=>a.date<b.date?-1:1);
  const inW=sw.filter(w=>days.includes(w.date));
  const before=sw.filter(w=>w.date<mk);
  let dkg=null,dwaist=null;
  if(inW.length){const last=inW[inW.length-1];const ref=before.length?before[before.length-1]:(inW.length>1?inW[0]:null);if(ref)dkg=Math.round((last.kg-ref.kg)*10)/10;
    const wl=inW.filter(w=>w.waist!=null);const wb=before.filter(w=>w.waist!=null);if(wl.length&&wb.length)dwaist=Math.round((wl[wl.length-1].waist-wb[wb.length-1].waist)*10)/10}
  const full=ws.filter(w=>w.mode!=='min').length,quick=ws.filter(w=>w.mode==='min').length;
  return {mk,days,n:dset.size,full,quick,sh,pts,water,meals,logged,pain,dkg,dwaist}
}
function weekTip(w){
  const wdn=(parse(todayStr()).getDay()+6)%7;
  if(w.mk===monKey(todayStr())&&wdn<6){const left=7-wdn;return 'Semana em andamento: restam '+left+(left===1?' dia':' dias')+' contando hoje. A meta é chegar a 5 treinos ou mais.'}
  const prev=[];for(let i=1;i<=3;i++){const x=parse(w.mk);x.setDate(x.getDate()-7*i);prev.push(weekData(fmt(x)).n)}
  if(w.pain!=null&&w.pain>=6)return 'Teve dor alta. Na próxima semana, use o modo Reduzido e o Treino rápido, evite saltos e procure um fisioterapeuta se continuar.';
  if(w.n>=5&&prev.every(n=>n>=5))return 'Quarta semana forte seguida. Faça uma semana de descarga: modo Reduzido em todos os treinos, sem aumentar a carga.';
  if(w.n>=5)return 'Semana forte. Se todas as séries saíram com 1 a 2 repetições sobrando, suba um pouco a carga.';
  if(w.n>=3)return 'Boa semana. Para chegar a 5 treinos, use o Treino rápido nos dias corridos: 10 minutos já mantém a sequência.';
  return 'Semana mais fraca, e tudo bem. Na próxima, o objetivo é não zerar nenhum dia: nos dias corridos faça só o Treino rápido.';
}
function wsum(where){
  const today=todayStr();const mk=monKey(today);const wd=(parse(today).getDay()+6)%7;
  let key=mk,title='Esta semana';
  if(where==='hoje'){if(wd===0){const x=parse(mk);x.setDate(x.getDate()-7);key=fmt(x);title='Resumo da semana passada'}else if(wd===6){title='Resumo da semana'}else return ''}
  return wcard(weekData(key),title,where==='hoje')
}
function wcard(w,title,link){
  const a=parse(w.days[0]),b=parse(w.days[6]);const f=d=>pad(d.getDate())+'/'+pad(d.getMonth()+1);

      <li>Comida: ${w.logged?(Math.round(w.meals/w.logged*10)/10+'').replace('.',',')+' de 5 refeições por dia marcado.':'nenhuma refeição marcada.'}</li>
      ${w.dkg!=null?`<li>Peso: ${sg(w.dkg)} kg${w.dwaist!=null?' · cintura '+sg(w.dwaist)+' cm':''}.</li>`:'<li>Sem medida nesta semana. Pese e meça uma vez por semana.</li>'}

}

function sessEntries(s,mode){
  const isShort=mode==='short';
  const items=sItems(s).filter(it=>!(isShort&&it.opt));
  const out=[];
  const add=(grp,it,key,o)=>out.push(Object.assign({grp,e:it.e,r:it.r,s:it.s,rest:it.rest||0,key,mode},o));
  if(!s.nowarm)WARM.forEach(x=>add('Aquecimento · 5 min',{e:x[0],r:x[1],s:1,rest:10},s.id+'_w_'+x[0],{track:0}));
  if(s.id==='F'){
    const rounds=isShort?2:3;
    items.filter(i=>i.circ).forEach(it=>add('Circuito · '+rounds+' rodadas',Object.assign({},it,{s:1,rest:0}),'F_'+it.e+'_c',{track:1}));
    items.filter(i=>!i.circ&&!i.mob).forEach(it=>add('Core',it,'F_'+it.e,{track:1}));
    items.filter(i=>i.mob).forEach(it=>add('Mobilidade',it,'F_'+it.e,{track:1,mob:1}));
  }else items.forEach(it=>add(s.id==='MIN'?'Treino rápido':s.id==='SOS'?'SOS costas':'Treino',it,s.id+'_'+it.e,{track:1}));
  if(!s.nocool)COOL.forEach(x=>add('Volta à calma · 3 min',{e:x[0],r:x[1],s:1,rest:10},s.id+'_c_'+x[0],{track:0}));
  return out;
}
function repParse(r){
  const m=r.match(/^(\d+)(?:\s*a\s*(\d+))?\s*(s|min)?(?=\s|$|,)/);
  if(!m)return {n:'máx',u:'o que der'};
  const n=m[2]?m[1]+'–'+m[2]:m[1];
  const unit=m[3]==='s'?'segundos':m[3]==='min'?'minuto':'repetições';
  const rest=r.slice(m[0].length).trim();
  return {n,u:unit+(rest?' '+rest:'')};
}

function loadTip(e,last){
  const m=String(e.r).match(/(\d+)(?:\s*a\s*(\d+))?/);if(!m||/de \d+ s/.test(e.r))return '';
  const lo=+m[1],hi=+(m[2]||m[1]);const sec=/\bs\b/.test(e.r);
  if(sec)return last.reps>=hi?'Você bateu o topo da faixa. No próximo treino, tente mais 5 a 10 segundos.':'Repita o tempo e tente chegar a '+hi+' segundos.';
  if(last.reps>=hi)return last.kg>0?'Você chegou a '+hi+' repetições. No próximo treino, suba um pouco a carga (cerca de 1 kg ou um elástico mais forte) e volte para '+lo+' repetições.':'Você chegou a '+hi+' repetições. Deixe a descida mais lenta (4 s) ou passe para uma versão mais difícil.';
  if(last.reps<lo)return 'Abaixo da faixa ('+lo+' a '+hi+'). Mantenha ou reduza a carga e foque na técnica.';
  return 'Dentro da faixa. Repita a carga e tente mais 1 repetição.';
}

function chart(pts,unit){
  if(!pts.length)return '<p class="small muted">Sem registros ainda.</p>';
  const W=320,H=150,pl=36,pr=14,pt=14,pb=24;
  const vs=pts.map(p=>p.v);let lo=Math.min(...vs),hi=Math.max(...vs);
  if(hi-lo<1){lo-=1;hi+=1}else{const m=(hi-lo)*.2;lo-=m;hi+=m}
  const t0=parse(pts[0].d).getTime(),t1=parse(pts[pts.length-1].d).getTime();
  const x=d=>pts.length===1?pl+(W-pl-pr)/2:pl+(parse(d).getTime()-t0)/((t1-t0)||1)*(W-pl-pr);
  const y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  const mid=(lo+hi)/2;
  let g='';[lo,mid,hi].forEach(v=>{g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" style="stroke:var(--line)" stroke-width="1"/><text x="${pl-4}" y="${(y(v)+3).toFixed(1)}" text-anchor="end">${v.toFixed(1)}</text>`});
  const path=pts.map((p,i)=>(i?'L':'M')+x(p.d).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const area=pts.length>1?`<path d="${path} L${x(pts[pts.length-1].d).toFixed(1)} ${H-pb} L${x(pts[0].d).toFixed(1)} ${H-pb} Z" style="fill:var(--accent)" opacity=".12"/>`:'';
  const dots=pts.map((p,i)=>`<circle cx="${x(p.d).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${i===pts.length-1?5:3}" style="fill:var(--accent)"/>`).join('');
  const last=pts[pts.length-1];
  const lab=(d)=>{const a=d.split('-');return a[2]+'/'+a[1]};
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico ${unit}">${g}${area}<path d="${path}" fill="none" style="stroke:var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}
   <text x="${Math.min(x(last.d),W-pr)}" y="${(y(last.v)-9).toFixed(1)}" text-anchor="end" style="fill:var(--ink);font-weight:600;font-size:11px">${last.v} ${unit}</text>
   <text x="${pl}" y="${H-6}">${lab(pts[0].d)}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${pts.length>1?lab(last.d):''}</text></svg>`;
}

/* ========== Treino guiado com voz ========== */
const V={mode:'none',voice:null,heard:false,tts:null};
let AC=null,wl=null,praiseI=0;
const NUM=['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez'];
const PRAISE=['Boa!','Isso!','Muito bem!','Mandou bem!','Segue assim!'];
function initVoice(){
  try{
    if('speechSynthesis' in window&&window.SpeechSynthesisUtterance){
      V.mode='web';
      const pick=()=>{const vs=window.speechSynthesis.getVoices();V.voice=vs.find(v=>/pt[-_]BR/i.test(v.lang))||vs.find(v=>/^pt/i.test(v.lang))||null};
      pick();window.speechSynthesis.onvoiceschanged=pick;
    }
  }catch(e){}
  try{if(window.claude&&window.claude.use)window.claude.use('tts').then(t=>{if(t)V.tts=t}).catch(()=>{})}catch(e){}
}
function ensureAudio(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==='suspended')AC.resume()}catch(e){}}
function beep(f,ms){try{if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.18;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+ms/1000)}catch(e){}}
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
function say(t,o){
  o=o||{};
  if(!S.voice.on&&!o.force)return;
  if(V.mode==='web'){
    try{
      const sy=window.speechSynthesis;sy.cancel();
      const u=new window.SpeechSynthesisUtterance(t);
      u.lang='pt-BR';if(V.voice)u.voice=V.voice;u.rate=S.voice.rate||1;
      u.onstart=()=>{V.heard=true};
      setTimeout(()=>{try{sy.resume();sy.speak(u)}catch(e){}},40);
    }catch(e){}
  }else if(V.mode==='tts'&&V.tts){
    try{V.tts.speak(t,{language:'pt-BR',rate:S.voice.rate||1}).catch(()=>{})}catch(e){}
  }else{
    if(o.n)beep(880,120);else if(o.go)beep(1320,300);
  }
}
function testVoice(){
  ensureAudio();V.heard=false;
  if(V.mode==='none'&&V.tts)V.mode='tts';
  say('Teste de voz. Se você está me ouvindo, o treino guiado vai funcionar.',{force:1});
  setTimeout(()=>{
    if(V.heard){toast('Voz funcionando.');return}
    if(V.tts){V.mode='tts';say('Teste de voz pelo Claude.',{force:1});toast('Usando a voz do Claude.');return}
    V.mode='none';beep(880,200);toast('Sem voz neste navegador. Abra o link no Chrome. Por enquanto uso bipes e vibração.')
  },2800);
}
async function lockScreen(){try{if(navigator.wakeLock)wl=await navigator.wakeLock.request('screen')}catch(e){}}
function unlockScreen(){try{if(wl)wl.release()}catch(e){}wl=null}
document.addEventListener('visibilitychange',()=>{if(G&&document.visibilityState==='visible')lockScreen()});

const setsFor=(it,mode)=>mode==='short'?(it.sh!=null?it.sh:Math.max(1,Math.min(it.s,it.s>2?it.s-1:it.s))):it.s;
function secSpeech(s){return s%60===0?(s/60===1?'1 minuto':(s/60)+' minutos'):s+' segundos'}
function timedSecs(r){
  if(/repeti|passos|letra|o que der|até faltar/i.test(r))return null;
  const m=r.match(/(\d+)\s*(?:a\s*(\d+))?\s*(min|s)\b/i);if(!m)return null;
  const a=+m[1],b=m[2]?+m[2]:a;let v=Math.round((a+b)/2);if(m[3].toLowerCase()==='min')v*=60;return v;
}
function repSpeech(r){return r.replace(/^(\d+(?:\s*a\s*\d+)?)(?=$|\s+por\b|,|\s+lentas)/,'$1 repetições')}
function unitDesc(u){let t=EX[u.e].n;if(u.circ)t+=', rodada '+u.round+' de '+u.rounds;else if(u.n>1)t+=', série '+u.k+' de '+u.n;if(u.side)t+=', '+u.side;return t}
function buildSteps(id,mode){
  const s=SESS[id],short=mode==='short';
  const items=sItems(s).filter(it=>!(short&&it.opt));
  const blocks=[];
  if(!s.nowarm)blocks.push({ph:'Aquecimento',wc:1,list:WARM.map(x=>({e:x[0],r:x[1],s:1,rest:10}))});
  if(id==='F'){
    blocks.push({ph:'Circuito',circ:1,rounds:short?2:3,list:items.filter(i=>i.circ)});
    blocks.push({ph:'Core',list:items.filter(i=>!i.circ&&!i.mob)});
    blocks.push({ph:'Mobilidade',list:items.filter(i=>i.mob)});
  }else blocks.push({ph:id==='MIN'?'Treino rápido':id==='SOS'?'SOS costas':'Treino',list:items});
  if(!s.nocool)blocks.push({ph:'Volta à calma',wc:1,list:COOL.map(x=>({e:x[0],r:x[1],s:1,rest:10}))});
  const units=[];
  blocks.forEach(b=>{
    const push=(it,k,n,ex)=>{
      const secs=timedSecs(it.r),sides=secs&&/por (lado|perna)/.test(it.r)?2:1;
      for(let sd=1;sd<=sides;sd++)units.push(Object.assign({e:it.e,r:it.r,ph:b.ph,k,n,secs,sd,sides,rest:sd<sides?5:it.rest,side:sides>1?(sd===1?'primeiro lado':'segundo lado'):'',wc:!!b.wc},ex));
    };
    if(b.circ){for(let rd=1;rd<=b.rounds;rd++)b.list.forEach((it,j)=>push(it,1,1,{circ:1,round:rd,rounds:b.rounds,firstInRound:j===0}))}
    else b.list.forEach(it=>{const n=b.wc?1:setsFor(it,mode);for(let k=1;k<=n;k++)push(it,k,n,{first:k===1})});
  });
  const steps=[];
  units.forEach((u,j)=>{
    const p=units[j-1];let rest=10,sideChange=false;
    if(p){
      rest=Math.max(p.rest,5);
      if(p.e===u.e&&p.k===u.k&&p.sd<p.sides){rest=5;sideChange=true}
      else if(!(p.circ&&u.circ)&&p.e!==u.e)rest=Math.max(rest,15);
    }
    steps.push({kind:'rest',dur:rest,u,first:!p,sideChange,prevTimed:!!(p&&p.secs),phaseChange:!!(p&&p.ph!==u.ph)});
    steps.push({kind:'work',u,dur:u.secs});
  });
  steps.push({kind:'end'});
  return steps;
}
function workText(u){
  const n=EX[u.e].n;
  if(u.secs){
    let t=(u.circ&&u.firstInRound?'Rodada '+u.round+' de '+u.rounds+'. ':'')+n;
    if(u.side&&u.sd===1)t+=', primeiro lado';
    return t+'. '+secSpeech(u.secs)+'. Vai!';
  }
  let t=n+(u.n>1?'. Série '+u.k+' de '+u.n:'')+'. '+repSpeech(u.r)+'.';
  if(u.first&&!u.wc&&S.voice.explain)t+=' '+EX[u.e].how.join(' ')+' ';
  return t+' Pode começar.';
}
function speakStep(st){
  if(!st)return;
  if(st.kind==='end'){say('Treino concluído. Muito bem! Registre o treino para somar seus pontos.');return}
  if(st.kind==='work'){say(workText(st.u),{go:1});vib(120);return}
  const u=st.u,long=st.dur>S.voice.warn+3;
  if(st.first){say('Vamos começar. '+u.ph+'. Primeiro: '+unitDesc(u)+'.');return}
  if(st.sideChange){say('Troque de lado.');return}
  let t=(st.prevTimed?'Pronto.':PRAISE[praiseI++%PRAISE.length])+' Descanse '+secSpeech(st.dur)+'.';
  if(st.phaseChange)t+=' Agora: '+u.ph+'.';
  if(!long)t+=' Próximo: '+unitDesc(u)+'.';
  say(t);
}
function startGuided(id,mode){
  if(G)stopGuided();
  ensureAudio();if(V.mode==='none'&&V.tts)V.mode='tts';
  ui.session=id;ui.ex=null;ui.gpanel=null;ui._nav=1;ui.mode=mode;ui.last=null;
  const steps=buildSteps(id,mode);
  G={id,mode,steps,i:-1,t0:0,pausedAt:0,pausedTotal:0,paused:false,said:{},iv:null};
  lockScreen();
  gNext();
  G.iv=setInterval(gTick,200);
  main.scrollTop=0;
}
function stopGuided(){
  if(!G)return;
  clearInterval(G.iv);G=null;
  try{window.speechSynthesis&&window.speechSynthesis.cancel()}catch(e){}
  try{if(V.tts)V.tts.stop()}catch(e){}
  unlockScreen();ui.gpanel=null;
}
function gNext(){
  G.i++;G.t0=Date.now();G.pausedTotal=0;G.said={};G.paused=false;
  const st=G.steps[G.i];
  if(st.kind==='end')clearInterval(G.iv);
  speakStep(st);
  render();main.scrollTop=0;
}
function gPause(){
  if(!G)return;
  if(G.paused){G.pausedTotal+=Date.now()-G.pausedAt;G.paused=false;say('Continuando.')}
  else{G.paused=true;G.pausedAt=Date.now();try{window.speechSynthesis&&window.speechSynthesis.cancel()}catch(e){}}
  render();
}
function gTick(){
  if(!G||G.paused)return;
  const st=G.steps[G.i];if(!st||st.kind==='end')return;
  const el=(Date.now()-G.t0-G.pausedTotal)/1000;
  const nEl=document.getElementById('gNum');
  if(st.dur==null){if(nEl&&st.kind==='work'&&false)nEl.textContent=mmss(Math.floor(el));return}
  const rem=st.dur-el,c=Math.ceil(rem);
  if(nEl)nEl.textContent=mmss(Math.max(0,c));
  const ring=document.getElementById('gRing');if(ring)ring.style.strokeDashoffset=(RC*Math.min(1,Math.max(0,el/st.dur))).toFixed(1);
  if(st.kind==='rest'){
    const warn=S.voice.warn,long=st.dur>warn+3;
    if(long&&c<=warn&&!G.said.w){G.said.w=1;say((warn===10?'Dez':'Cinco')+' segundos. Próximo: '+unitDesc(st.u)+'.')}
    const from=(long&&warn===5)?4:5;
    if(st.dur>=6&&c<=from&&c>=1&&!G.said['c'+c]){G.said['c'+c]=1;say(NUM[c],{n:c});vib(40)}
  }else{
    if(st.dur>=40&&el>=st.dur/2&&!G.said.h){G.said.h=1;say('Metade.')}
    if(st.dur>20&&c<=10&&c>3&&!G.said.t){G.said.t=1;say('Dez segundos.')}
    if(st.dur>=8&&c<=3&&c>=1&&!G.said['c'+c]){G.said['c'+c]=1;say(NUM[c],{n:c});vib(40)}
  }
  if(rem<=0)gNext();
}
function voiceSettings(){
  const v=S.voice;
  return `<section class="card"><div class="eyebrow">Voz do treino</div>
   <div class="stack" style="margin-top:8px">
    <div class="row between"><span class="small">Voz</span><button class="btn small" data-act="gv" data-id="on">${v.on?'Ligada':'Desligada'}</button></div>

const RC=2*Math.PI*100;
function vGuiado(){
  const st=G.steps[G.i];
  const works=G.steps.filter(x=>x.kind==='work');
  const dn=G.steps.slice(0,G.i).filter(x=>x.kind==='work').length;
  const segs=works.map((_,i)=>`<i class="${i<dn?'on':(i===dn&&st.kind==='work')?'cur':''}"></i>`).join('');
  const top=(q)=>`<div class="gtop"><button class="gx" data-act="gexit" aria-label="Sair do treino">${IC.x}</button><div class="gseg">${segs}</div>${q?`<button class="gi" data-act="gpanel" data-id="how" aria-label="Como fazer">${IC.q}</button><button class="gi" data-act="gpanel" data-id="voice" aria-label="Voz">${IC.vol}</button>`:''}</div>`;
  if(st.kind==='end')return `<div class="gs end">${top(false)}<div class="gcenter"><div class="eyebrow">Treino guiado</div><h2>Treino concluído</h2><p class="sub muted">Registre agora para somar os pontos e manter a sequência.</p></div><div class="gbot"><button class="gpill" data-act="gfinish">Registrar treino</button></div></div>`;
  const u=st.u,isRest=st.kind==='rest',ex=EX[u.e];
  const label=G.paused?'Pausado':isRest?(st.first?'Preparado para começar':st.sideChange?'Troque de lado':'Descanse'):(u.ph+(u.side?' · '+u.side:''));
  const info=u.circ?'Rodada '+u.round+' de '+u.rounds:(u.n>1?'Série '+u.k+' de '+u.n:'');
  const timed=isRest||!!u.secs;
  let mid;
  if(timed){
    mid=`<div class="gring"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="100" fill="none" stroke="var(--surface2)" stroke-width="12"/><circle id="gRing" cx="110" cy="110" r="100" fill="none" stroke="${isRest?'var(--ok)':'var(--accent)'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${RC.toFixed(1)}" style="stroke-dashoffset:0" transform="rotate(-90 110 110)"/></svg><div class="gn"><div class="gnum" id="gNum">${mmss(Math.ceil(st.dur))}</div></div></div>`;
  }else{
    const rp=repParse(u.r);
    mid=`<div class="gring"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="100" fill="none" stroke="var(--accent)" stroke-width="12"/></svg><div class="gn"><div class="greps">${esc(rp.n)}</div><div class="gunit">${esc(rp.u)}</div></div></div>`;
  }
  const nameLine=isRest?`<div class="gsub">Próximo${info?' · '+esc(info.toLowerCase()):''}${u.side?' · '+esc(u.side):''}</div>`:`<div class="gsub">${esc(info)}</div>`;
  const center=(!isRest&&!u.secs)?`<button class="gpill" data-act="gdone">${ICK.replace('width="16" height="16"','width="22" height="22"')}<span>Feito</span></button>`
    :`<button class="gpill" data-act="gpause">${G.paused?IC.play+'<span>Continuar</span>':IC.pause+'<span>Pausar</span>'}</button>`;
  let sheet='';
  if(ui.gpanel==='how')sheet=`<div class="sheet"><div class="sh"><h3>${esc(ex.n)}</h3><button class="gi" data-act="gpanel" data-id="how" aria-label="Fechar">${IC.x}</button></div><ul class="how small">${ex.how.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul><p class="small" style="margin-top:8px"><b>Atenção:</b> ${esc(ex.tip)}</p></div>`;
  else if(ui.gpanel==='voice')sheet=`<div class="sheet"><div class="sh"><h3>Voz do treino</h3><button class="gi" data-act="gpanel" data-id="voice" aria-label="Fechar">${IC.x}</button></div>${voiceSettings()}</div>`;
  return `<div class="gs ${isRest?'rest':'work'}">
    ${top(true)}
    <div class="glab">${esc(label)}</div>
    <div class="gname">${esc(ex.n)}</div>
    ${nameLine}
    <div class="gmid">${mid}</div>
    <div class="gfig">${figBox(u.e,'')}</div>
    <div class="gbot"><button class="gc" data-act="grepeat" aria-label="Repetir a instrução">${IC.vol}</button>${center}<button class="gc" data-act="gskip" aria-label="Pular">${IC.skip}</button></div>
    ${sheet}
  </div>`;
}

      ${RV.frames.length?`<div class="thumbs">${RV.frames.map(u=>'<img alt="Quadro do vídeo" src="'+u+'">').join('')}</div>`:''}
      ${RV.text?`<div class="opt rvout small">${esc(RV.text)}</div><p class="tiny muted">Análise por imagens paradas, só do que aparece nos quadros. Não substitui avaliação de médico ou fisioterapeuta.</p>`:''}
      ${(RV.text||RV.frames.length)&&!RV.busy?'<button class="btn small ghost" data-act="rvclear">Apagar imagens e resultado</button>':''}
    </div></section>`;
}
const seekTo=(v,t)=>new Promise(res=>{let d=false;const f=()=>{if(d)return;d=true;v.removeEventListener('seeked',f);res()};v.addEventListener('seeked',f);setTimeout(f,3500);v.currentTime=t});
async function reviewVideo(file){
  if(RV.busy)return;
  if(!RV.sample){RV.err='A análise por imagem não está disponível neste app. Abra o link no Chrome.';rvRender();return}
  RV.busy=true;RV.text='';RV.err='';clearFrames();RV.status='Lendo o vídeo...';rvRender();
  let url=null;
  try{
    try{const lim=await RV.sample.limits();if(lim&&lim.images===false)throw {code:'no_images'}}catch(e){if(e&&e.code==='no_images')throw e}
    url=URL.createObjectURL(file);
    const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=url;
    await new Promise((res,rej)=>{v.onloadedmetadata=res;v.onerror=()=>rej({code:'video'});setTimeout(()=>rej({code:'timeout'}),15000)});
    const dur=v.duration;if(!isFinite(dur)||dur<=0)throw {code:'video'};
    const use=Math.min(dur,45),N=8;
    const sc=Math.min(1,640/Math.max(v.videoWidth||640,v.videoHeight||640));
    const cv=document.createElement('canvas');cv.width=Math.max(2,Math.round((v.videoWidth||640)*sc));cv.height=Math.max(2,Math.round((v.videoHeight||360)*sc));
    const ctx=cv.getContext('2d');const blobs=[];
    for(let i=0;i<N;i++){
      RV.status='Tirando imagens ('+(i+1)+' de '+N+')...';rvRender();
      await seekTo(v,use*(0.06+0.88*i/(N-1)));
      ctx.drawImage(v,0,0,cv.width,cv.height);
      const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.72));
      if(b){blobs.push(b);RV.frames.push(URL.createObjectURL(b))}
    }
    if(!blobs.length)throw {code:'video'};
    const ex=EX[RV.ex];
    const prompt='Você é um fisioterapeuta e treinador cuidadoso. As imagens são '+blobs.length+' quadros, em ordem cronológica, de um vídeo de '+(prof().sex==='F'?'uma mulher':'um homem')+' de '+prof().age+' anos fazendo o exercício "'+ex.n+'" em casa. Contexto: ele tem dor nas costas (lombar, coluna e escápulas) e o joelho meio rígido.\n'+
      'Como o exercício deve ser feito: '+ex.how.join(' ')+' Atenção: '+ex.tip+'\n'+
      'Avalie só o que dá para ver nos quadros: alinhamento da coluna (neutra ou arredondada/arqueada), posição dos joelhos em relação aos pés, amplitude e posição de ombros e quadril. Você não consegue ver ritmo nem contar repetições, e não deve fingir que consegue.\n'+
      'Responda em português do Brasil, em texto simples sem markdown, curto, neste formato:\nO que está bom: (1 ou 2 itens)\nO que corrigir: (até 3 itens, cada um com o que fazer diferente)\nSe algo sugerir risco para a coluna ou o joelho, diga para reduzir a carga ou parar e procurar um profissional.\nSe o enquadramento, a luz ou o ângulo não permitirem avaliar, diga como regravar. Não dê diagnóstico e não invente o que não aparece.';
    RV.status='Claude está analisando...';rvRender();
    const out=await RV.sample(prompt,{images:blobs,modelTier:'default',cache:false,onText:o=>{RV.text=o.text;rvRender()}});
    RV.text=(out&&out.text)||RV.text;
  }catch(e){
    const c=e&&e.code;
    RV.err=c==='not_granted'?'Permissão negada para a análise.':c==='rate_limited'?'Muitas análises seguidas. Espere um pouco.':(c==='video'||c==='timeout')?'Não consegui ler esse vídeo. Tente gravar de novo ou escolher outro arquivo.':c==='no_images'?'A análise por imagem não está disponível aqui.':'A análise falhou. Tente de novo.';
  }finally{
    RV.busy=false;RV.status='';try{if(url)URL.revokeObjectURL(url)}catch(e){}rvRender();
  }
}

  else if(a==='cmpang'){ui.cmpAng=id;render()}

    if(kg==null&&waist==null&&!Object.values(ex).some(v=>v!=null)){toast('Preencha pelo menos uma medida.');return}

  else if(a==='backupFile'){
    S.lastBackup=todayStr();save();
    try{const b=new Blob([JSON.stringify(S)],{type:'application/json'});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download='treino-em-casa-backup-'+todayStr()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Arquivo baixado.')}catch(x){toast('Não deu para baixar. Use Copiar backup.')}}

  else if(a==='altsave'){const n=($('#altN').value||'').trim();if(!n){toast('Escreva o que você comeu.');return}
    const p=Math.max(0,Math.min(150,parseInt($('#altP').value,10)||0));const r=dayRec(todayStr());r.alt[id]={n:n.slice(0,60),p};const b=calc().total;r.m[id]=true;ui.alt=null;save();render();const d=calc().total-b;toast(d>0?'Dia completo! +'+d+' pontos':'Refeição registrada.')}
  else if(a==='altclear'){const r=dayRec(todayStr());delete r.alt[id];r.m[id]=false;save();render()}

  else if(a==='finish'){
    const date=$('#fDate').value||todayStr(),pain=+$('#fPain').value,note=$('#fNote').value.trim();
    const s=SESS[ui.session];
    const before=calc();
    S.workouts.push({id:uid(),date,session:s.id,mode:isQ(s.id)?'min':ui.mode,pain,note});
    const after=calc();
    save();Object.keys(ui.done).forEach(k=>{if(k.startsWith(s.id+'_')||(s.id==='F'&&k.startsWith('F_')))delete ui.done[k]});
    const gained=after.total-before.total,inf=after.info[date]||{base:0,bonus:0},pv=before.info[date]||{base:0,bonus:0};
    const dB=inf.base-pv.base,dS=inf.bonus-pv.bonus,rest=gained-dB-dS;
    ui.last={gained,lines:[['Treino',dB],['Sequência',dS],['Bônus da semana',rest]].filter(x=>x[1]>0),
